name: cuteapp
description: "Your cute lifestyle companion app 🌸"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  intl: ^0.19.0
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  uuid: ^4.4.2
  table_calendar: ^3.1.2
  audioplayers: ^6.1.0
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
  fonts:
    - family: NCLGasdrifo
      fonts:
        - asset: assets/fonts/NCLGasdrifo-Demo.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app-icon.png
